spring.application.name=ms-usuarios
server.port=8000

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/usuarios_db}
spring.datasource.username=${DATABASE_USER:usuarios_user}
spring.datasource.password=${DATABASE_PASSWORD:usuarios_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

seed.count=${SEED_COUNT:20000}

springdoc.swagger-ui.path=/swagger-ui.html
